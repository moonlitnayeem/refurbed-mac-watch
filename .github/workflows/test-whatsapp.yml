name: WhatsApp delivery test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Build a safe test alert
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("mac_studio_alerts.json").write_text(
              json.dumps([{
                  "model": "Twilio integration test",
                  "price": 0,
                  "url": "https://github.com/moonlitnayeem/refurbed-mac-watch/issues/2",
              }], indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Send test through Twilio WhatsApp
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.META_WHATSAPP_TO }}
        run: python3 send_whatsapp.py
