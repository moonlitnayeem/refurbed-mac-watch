name: Telegram delivery test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Build a safe test alert
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("phone_alerts.json").write_text(
              json.dumps([{
                  "title": "Telegram delivery test",
                  "test": True,
                  "model": "GitHub Actions integration check",
                  "price": 0,
                  "url": "https://github.com/moonlitnayeem/refurbed-mac-watch/issues/2",
              }], indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Send test through Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 send_telegram.py
