name: refurbed watch

on:
  # Cloudflare's Cron Trigger calls this every 15 minutes. Keeping scheduling
  # outside GitHub avoids delayed or dropped native schedule events.
  workflow_dispatch:

permissions:
  contents: write           # commit state.json back to the repo
  issues: write             # open an issue, and create the "alert" label

concurrency:
  group: refurbed-watch
  cancel-in-progress: false # never cut a run short mid-write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # A few commits of history so the push-retry rebase below has a merge
          # base to work with. Depth 1 leaves nothing to rebase onto.
          fetch-depth: 5

      - name: Run tests
        # Hermetic and instant. If refurbed changes their markup badly enough
        # to break the parser, this fails loudly instead of silently reporting
        # "no change" forever.
        run: python3 -m unittest discover -q

      - name: Check refurbed.se
        id: watch
        run: python3 refurbed_watch.py --notify github --state state.json

      - name: Send WhatsApp alerts for new Mac Studio listings
        env:
          META_WHATSAPP_TOKEN: ${{ secrets.META_WHATSAPP_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.META_WHATSAPP_PHONE_NUMBER_ID }}
          META_WHATSAPP_TO: ${{ secrets.META_WHATSAPP_TO }}
          META_WHATSAPP_TEMPLATE_NAME: ${{ secrets.META_WHATSAPP_TEMPLATE_NAME }}
        run: python3 send_whatsapp.py

      - name: Post results to the watch issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --body-file alert.md

      - name: Prepare older updates for archival
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 archive_issue_history.py prepare --issue 2 --keep 4

      - name: Save state
        run: |
          # Stage first: on the very first run state.json is untracked, and
          # `git diff` does not look at untracked files -- so testing the
          # worktree directly would report "no change" forever and the baseline
          # would never be committed.
          git add state.json
          if [[ -d history ]]; then git add history; fi
          if git diff --cached --quiet -- state.json history; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "refurbed-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "state: refurbed check $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          # Another run may have pushed while we were working; rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || true
          done
          echo "::error::Could not push state and archive after 3 attempts"
          exit 1

      - name: Remove safely archived comment cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 archive_issue_history.py delete --issue 2 --ref main
