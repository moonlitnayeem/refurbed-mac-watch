name: refurbed watch

on:
  schedule:
    # Every 15 minutes, offset off the hour. GitHub queues a lot of jobs at
    # :00 and delays them, so odd minutes get picked up more promptly.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # commit state.json back to the repo
  issues: write             # open an issue, and create the "alert" label

concurrency:
  group: refurbed-watch
  cancel-in-progress: false # never cut a run short mid-write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # A few commits of history so the push-retry rebase below has a merge
          # base to work with. Depth 1 leaves nothing to rebase onto.
          fetch-depth: 5

      - name: Run tests
        # Hermetic and instant. If refurbed changes their markup badly enough
        # to break the parser, this fails loudly instead of silently reporting
        # "no change" forever.
        run: python3 -m unittest discover -q

      - name: Check refurbed.se
        id: watch
        run: python3 refurbed_watch.py --notify github --state state.json

      - name: Open an issue
        if: steps.watch.outputs.has_alerts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Via the environment, never inlined into the script. The title is
          # built from text scraped off refurbed.se, so treating it as shell
          # source would hand a third party a command prompt on this runner.
          ALERT_TITLE: ${{ steps.watch.outputs.alert_title }}
        run: |
          # gh validates --label client-side and hard-fails if the label is
          # missing, which would swallow the alert. Make sure it exists first.
          gh label create alert \
            --color d73a4a \
            --description "refurbed.se stock alert" >/dev/null 2>&1 || true

          gh issue create --title "$ALERT_TITLE" --body-file alert.md --label alert \
            || gh issue create --title "$ALERT_TITLE" --body-file alert.md

      - name: Save state
        run: |
          # Stage first: on the very first run state.json is untracked, and
          # `git diff` does not look at untracked files -- so testing the
          # worktree directly would report "no change" forever and the baseline
          # would never be committed.
          git add state.json
          if git diff --cached --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "refurbed-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "state: refurbed check $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          # Another run may have pushed while we were working; rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || true
          done
          echo "::warning::Could not push state after 3 attempts"
